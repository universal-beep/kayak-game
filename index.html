function swapPalette(map, table){
  return map.map(row => row.split("").map(ch => (ch !== "." && table[ch]) ? table[ch] : ch).join(""));
}
// Байдарка игрока — та же карта, что у соперника, но в своей палитре, плюс
// два скошенных варианта для крена. Скос дешевле трёх ручных карт и читается
// как наклон корпуса при манёвре.
function shearMap(map, dir){
  const w = map[0].length, h = map.length;
  return map.map((row, r) => {
    const sh = Math.round((h/2 - r) / h * 4) * dir;
    if (sh === 0) return row;
    if (sh > 0) return rep(".", sh) + row.slice(0, w - sh);
    return row.slice(-sh) + rep(".", -sh);
  });
}
SPR.kayak_center = { map: swapPalette(SPR.rower.map, { z:"r", r:"w" }) };
SPR.kayak_left   = { map: shearMap(SPR.kayak_center.map, -1) };
SPR.kayak_right  = { map: shearMap(SPR.kayak_center.map,  1) };

function spriteSize(name){
  const m = SPR[name].map;
  return { w: m[0].length * SCALE, h: m.length * SCALE };
}
function rasterize(map){
  const cvs = document.createElement("canvas");
  cvs.width = map[0].length * SCALE;
  cvs.height = map.length * SCALE;
  const c2 = cvs.getContext("2d");
  c2.imageSmoothingEnabled = false;
  for (let r = 0; r < map.length; r++)
    for (let q = 0; q < map[r].length; q++){
      const ch = map[r][q];
      if (ch === ".") continue;
      c2.fillStyle = PAL[ch] || "#ff00ff";
      c2.fillRect(q*SCALE, r*SCALE, SCALE, SCALE);
    }
  return cvs;
}
// Мель рисуется формулой, но со снапом на ту же пиксельную сетку:
// неровный контур, зернистый песок трёх оттенков и пенный ободок.
function rasterizeShallows(){
  const CW = 34, CH = 15;
  const cvs = document.createElement("canvas");
  cvs.width = CW*SCALE; cvs.height = CH*SCALE;
  const c2 = cvs.getContext("2d");
  for (let r = 0; r < CH; r++) for (let q = 0; q < CW; q++){
    const nx = (q-(CW-1)/2)/((CW-1)/2), ny = (r-(CH-1)/2)/((CH-1)/2);
    const ang = Math.atan2(ny, nx);
    const wob = 1 + 0.11*Math.sin(ang*3+0.7) + 0.07*Math.sin(ang*5+2.1);
    const dd = Math.sqrt(nx*nx+ny*ny)/wob;
    const hh = ((q*73+r*151)%17)/17;
    let col = null;
    if (dd < 0.45) col = hh<0.18?PAL.S:PAL.s;
    else if (dd < 0.72) col = hh<0.25?PAL.d:PAL.S;
    else if (dd < 0.93) col = hh<0.35?PAL.S:PAL.d;
    else if (dd < 1.04) col = PAL.f;
    if (col){ c2.fillStyle = col; c2.fillRect(q*SCALE, r*SCALE, SCALE, SCALE); }
  }
  return cvs;
}
function prerenderAll(){
  for (const name of Object.keys(SPR)){
    const spr = SPR[name];
    spr.img = rasterize(spr.map);
    if (spr.variants) spr.imgs = spr.variants.map(tb => rasterize(swapPalette(spr.map, tb)));
  }
  SPR.shallows = { map: new Array(15).fill(rep(".",34)), img: rasterizeShallows() };
}
function drawSprite(name, x, y, variant){
  const spr = SPR[name];
  if (!spr) return;
  const img = (variant != null && spr.imgs) ? spr.imgs[variant] : spr.img;
  if (!img) return;
  cx.drawImage(img, Math.round(x - img.width/2), Math.round(y - img.height/2));
}
function drawShadow(x, y, w){
  cx.fillStyle = "rgba(0,0,0,0.25)";
  cx.beginPath(); cx.ellipse(x, y, w*0.40, 5, 0, 0, Math.PI*2); cx.fill();
}

/* ===== 3. Геометрия русла ===== */
const PY = H - 90;                 // экранная строка, на которой стоит байдарка

// Амплитуды и периоды подобраны так, чтобы поворот читался ЗА ОДИН ЭКРАН.
// Период основной синусоиды ~1960 мировых пикселей при видимых 720 —
// на экране помещается больше трети волны, и русло заметно уходит вбок.
// Суммарный размах оси 107 px; вместе с максимальной полушириной 97.5
// это 204.5 при половине холста 210, то есть берега не срезаются.
// Одна доминирующая волна вместо трёх сопоставимых. Три близкие по амплитуде
// синусоиды давали биения: местами складывались в крутой поворот, местами
// гасили друг друга в прямой участок. Теперь 84 из 107 приходится на одну
// волну с периодом ~1850 px, и русло виляет непрерывно, а мелкие члены
// лишь добавляют неровности, чтобы поворот не выглядел механическим.
function centerAt(w){
  return W/2
    + 84*Math.sin(w*0.0034)
    + 16*Math.sin(w*0.0089 + 1.3)
    + 7*Math.sin(w*0.0019 + 0.6);
}

// Размах ширины намеренно уменьшен с 110 до 60: раньше он перебивал поворот
// и река читалась как «то сужается, то расширяется», а не как «поворачивает».
function baseWidthAt(w){
  return 165 + 30*Math.sin(w*0.0022 + 2.1);
}

function secondDiff(fn, w, h){
  const s = h || 40;
  return fn(w + s) - 2*fn(w) + fn(w - s);
}

function curvAt(w){
  return secondDiff(centerAt, w, 40);
}

function screenYOf(wy){ return PY + g.scroll - wy; }
function worldYOf(y){ return g.scroll + PY - y; }
function spawnWy(){ return g.scroll + PY + 60; }
function offScreen(wy){ return screenYOf(wy) > H + 60; }
function screenXOf(t, wy){ return centerAt(wy) + t * widthAt(wy) / 2; }

/* ===== 4. Сегменты: плёс и порог ===== */
const FIRST_RAPID_AT = 1200;
const CALM_MIN = 1400, CALM_MAX = 2400;
const RAPID_MIN = 700, RAPID_MAX = 1100;

function ensureSegments(untilW){
  if (g.segs.length === 0)
    g.segs.push({ type:"calm", start:0,
                  end: Math.max(FIRST_RAPID_AT, CALM_MIN + Math.random()*(CALM_MAX-CALM_MIN)) });
  while (g.segs[g.segs.length-1].end < untilW){
    const prev = g.segs[g.segs.length-1];
    const type = prev.type === "calm" ? "rapid" : "calm";
    const len = type === "calm"
      ? CALM_MIN + Math.random()*(CALM_MAX-CALM_MIN)
      : RAPID_MIN + Math.random()*(RAPID_MAX-RAPID_MIN);
    g.segs.push({ type, start: prev.end, end: prev.end + len });
  }
}

function segAt(w){
  for (let i = 0; i < g.segs.length; i++)
    if (w >= g.segs[i].start && w < g.segs[i].end) return g.segs[i];
  return g.segs.length ? g.segs[g.segs.length-1] : { type:"calm", start:0, end:Infinity };
}

/* ===== 7. Физика байдарки ===== */
// DAMP = 0.90 — это сопротивление воды: постоянная времени 10 кадров, гребок
// отзывается сразу. Более высокие значения дают ощущение байдарки на льду.
// DRIFT пересчитан под новую форму русла: кривизна пропорциональна квадрату
// частоты, и после усиления поворота она выросла с ±0.9 до ±3.6. Поэтому
// коэффициент снижен вчетверо, с 0.0016 до 0.0004 — иначе снос перебивает
// гребок и на повороте байдарку невозможно удержать.
const ACC = 0.0035, DAMP = 0.90, VMAX = 0.035, DRIFT = 0.0004, TMAX = 0.94;

function flowMul(t){ return 1.18 - 0.34*t*t; }

function stepLateral(input){
  const breadOn = g.breadT > 0;
  g.vt += input * ACC * (breadOn ? 1.6 : 1);
  // Центробежный снос: на повороте прижимает к внешнему берегу.
  // curvAt > 0 там, где ось выгибается вправо, — байдарку при этом уносит влево.
  g.vt -= curvAt(g.scroll) * DRIFT * (breadOn ? 0.5 : 1);
  g.vt *= DAMP;
  // Батон поднимает и потолок скорости, а не только ускорение: иначе обе
  // скорости упираются в один и тот же VMAX и эффект пропадает на длинной гребле.
  const vmax = VMAX * (breadOn ? 1.5 : 1);
  if (g.vt >  vmax) g.vt =  vmax;
  if (g.vt < -vmax) g.vt = -vmax;
  g.t += g.vt;
  if (g.t >  TMAX){ g.t =  TMAX; if (g.vt > 0) g.vt = 0; }
  if (g.t < -TMAX){ g.t = -TMAX; if (g.vt < 0) g.vt = 0; }
}

function leanOf(vt){
  if (vt >  0.012) return "kayak_right";
  if (vt < -0.012) return "kayak_left";
  return "kayak_center";
}

const BLEND = 200;

function rapidBlend(w){
  const s = segAt(w);
  if (!g.segs.length) return 0;
  const inRapid = s.type === "rapid";
  // Слева от самого первого сегмента соседа нет — там граница не настоящая,
  // иначе игра начиналась бы с наполовину суженным руслом.
  const dLeft  = s.start > 0 ? w - s.start : Infinity;
  const dRight = s.end - w;
  const dIn = Math.min(dLeft, dRight);
  const k = Math.max(0, Math.min(1, dIn / BLEND));
  return inRapid ? 0.5 + 0.5*k : 0.5 - 0.5*k;
}

function widthAt(w){ return baseWidthAt(w) * (1 - 0.38*rapidBlend(w)); }
function speedMulAt(w){ return 1 + 0.4*rapidBlend(w); }

/* ===== 9. Рендер: русло и берега ===== */
const BAND = 4;   // высота полосы построчного рендера

function drwBg(){
  for (let y = 0; y < H; y += BAND){
    const wy = worldYOf(y);
    const c  = centerAt(wy);
    const hw = widthAt(wy)/2;
    const L = c - hw, R = c + hw;
    const rb = rapidBlend(wy);

    cx.fillStyle = "#3f8f43";
    cx.fillRect(0, y, Math.max(0, L), BAND);
    cx.fillRect(Math.min(W, R), y, W - R, BAND);

    cx.fillStyle = "#d2b674";
    cx.fillRect(L - 6, y, 6, BAND);
    cx.fillRect(R, y, 6, BAND);

    cx.fillStyle = "#1565c0";
    cx.fillRect(L, y, R - L, BAND);

    cx.fillStyle = "#0d47a1";
    cx.fillRect(L, y, 8, BAND);
    cx.fillRect(R - 8, y, 8, BAND);

    if (Math.sin(wy*0.055) > 0.62){
      cx.fillStyle = "rgba(255,255,255,0.10)";
      cx.fillRect(L + 12, y, R - L - 24, BAND);
    }
    if (rb > 0.05 && Math.sin(wy*0.13 + Math.cos(wy*0.05)*2) > 0.55 - rb*0.45){
      cx.fillStyle = `rgba(255,255,255,${0.18 + rb*0.42})`;
      const bw = (R - L) * (0.20 + 0.5*Math.abs(Math.sin(wy*0.021)));
      cx.fillRect(L + 8 + ((wy*7) % Math.max(1, R - L - bw - 16)), y, bw, BAND);
    }
  }
}
// Соответствие внутренних типов препятствий именам спрайтов.
const OB_SPRITE = { log:"log", shallows:"shallows", seaweed:"seaweed", kayaker:"rower" };
const BN_SPRITE = { bread:"bread", whisky:"whisky", medkit:"medkit", axe:"axe" };

function drwKy(){
  const x = screenXOf(g.t, g.scroll), y = PY;
  // Мигание в кадрах неуязвимости после удара.
  if (g.inv > 0 && Math.floor(g.frame/4) % 2 === 0) return;
  const name = leanOf(g.vt);
  const sz = spriteSize(name);
  drawShadow(x, y + sz.h/2 - 4, sz.w);
  drawSprite(name, x, y);
  drwPaddle(x, y, g.frame * 6);
  if (g.sh){
    cx.strokeStyle = "rgba(79,195,247," + (0.35 + Math.sin(g.frame*0.1)*0.15) + ")";
    cx.lineWidth = 4;
    cx.beginPath(); cx.ellipse(x, y, 34, 28, 0, 0, Math.PI*2); cx.stroke();
  }
}

// Весло рисуется отдельно от корпуса, потому что оно анимируется:
// гребок уходит то влево, то вправо.
function drwPaddle(x, y, phase){
  const dir = Math.sin(phase*0.05) > 0 ? 1 : -1;
  for (let i = -9; i <= 9; i++){
    const px = x + i*SCALE, py = y + Math.round(i*0.45*dir)*SCALE;
    const blade = Math.abs(i) >= 7;
    cx.fillStyle = blade ? PAL.W : PAL.n;
    cx.fillRect(px, py, SCALE, blade ? SCALE*2 : SCALE);
  }
}

function drwOb(o){
  const x = screenXOf(o.t, o.wy), y = screenYOf(o.wy);
  if (y < -90 || y > H + 90) return;
  const name = o.sprite || OB_SPRITE[o.type] || "boulder";
  const sz = spriteSize(name);
  drawShadow(x, y + sz.h/2 - 3, sz.w);
  drawSprite(name, x, y, o.variant);
  if (o.type === "kayaker") drwPaddle(x, y, o.wy);
  if (o.type === "rock"){
    // Пена там, где вода разбивается о камень.
    cx.fillStyle = PAL.f;
    cx.fillRect(x - sz.w*0.32, y + sz.h/2 - 4, sz.w*0.26, 3);
    cx.fillRect(x + sz.w*0.08, y + sz.h/2 - 4, sz.w*0.22, 3);
  }
}

function drwBn(b){
  const x = screenXOf(b.t, b.wy);
  const y = screenYOf(b.wy) + Math.sin(g.frame*0.08)*3;
  if (y < -70 || y > H + 70) return;
  const name = BN_SPRITE[b.type] || "bread";
  const sz = spriteSize(name);
  drawShadow(x, y + sz.h/2, sz.w);
  drawSprite(name, x, y);
  if (b.type === "bread") drawSprite("slice", x + 30, y + 18);
}

function drwBev(e){
  const ax = centerAt(e.wy), hw = widthAt(e.wy)/2;
  const bx = ax + e.side*(hw + e.off), by = screenYOf(e.wy);
  if (by < -160 || by > H + 160 || bx < -60 || bx > W + 60) return;
  if (e.type === "ducks"){
    for (let i = 0; i < 3; i++)
      drawSprite("duck", bx + i*16 - 16, by + Math.sin(g.frame*0.06 + i)*3);
    return;
  }
  const name = e.type === "camp" ? "tent" : e.type;
  drawSprite(name, bx, by);
}

const BEST_KEY = "kayak_best";
function loadBest(){ return Number(localStorage.getItem(BEST_KEY) || 0); }
function saveBest(v){ if (v > loadBest()) localStorage.setItem(BEST_KEY, String(v)); }

  cx.fillStyle = "#9aa9b2";
  cx.fillText("РЕКОРД: " + loadBest(), 12, 60);

    cx.fillStyle = i < g.hp ? "#e53935" : "#4a2c2c";

  }
  if (g.sh){ cx.fillStyle = "#4fc3f7"; cx.fillRect(W - 104, 13, 14, 13); }

  if (g.breadT  > 0){ drwEffBar("БАТОН", g.breadT/BREAD_FRAMES,  "#eec27a", ey); ey += 16; }

  const next = g.segs.find(x => x.type === "rapid" && x.start > g.scroll);

    const pr = (g.scroll - seg.start) / (seg.end - seg.start);
    cx.fillStyle = "rgba(0,0,0,0.45)"; cx.fillRect(W/2 - 60, 92, 120, 8);
    cx.fillStyle = g.cleanRun ? "#4fc3f7" : "#ff5252";
    cx.fillRect(W/2 - 60, 92, 120*Math.max(0, Math.min(1, pr)), 8);
  }

}

function drwEffBar(label, frac, color, y){
  cx.font = "7px " + F;
  cx.fillStyle = color; cx.fillText(label, 12, y);
  cx.fillStyle = "rgba(0,0,0,0.45)"; cx.fillRect(70, y - 7, 60, 6);
  cx.fillStyle = color; cx.fillRect(70, y - 7, 60*frac, 6);
}

function drwPops(){
  cx.save(); cx.font = "9px " + F; cx.textAlign = "center";
  for (const p of g.pops){
    cx.globalAlpha = Math.min(1, p.life/25);
    cx.fillStyle = p.color;
    cx.fillText(p.text, p.x, p.y);
  }
  cx.restore(); cx.globalAlpha = 1;
}

// Полуширина препятствия в пикселях — нужна и для коллизий, и для проверки,
// влезает ли оно в русло.
function obHalfPx(ty,size){
  if(ty=="log")return size/2+9;
  if(ty=="shallows")return 34;
  if(ty=="seaweed")return 15;
  return 24;
}
function spOb(){
  const wy=spawnWy(),rw=widthAt(wy),rb=rapidBlend(wy);
  const types=["rock","log","shallows","seaweed","kayaker"];
  const ws=rb>0.5?[0.50,0.10,0.14,0.13,0.13]:[0.30,0.20,0.18,0.17,0.15];
  let r=Math.random(),c=0,ty="rock";
  for(let i=0;i<types.length;i++){c+=ws[i];if(r<c){ty=types[i];break;}}
  const sz=ty=="log"?36+Math.random()*24:14+Math.random()*8;
  // Камень бывает трёх форм: валун, клык и плита. Разные габариты дают
  // разные способы уворота, а плита ещё и не всегда влезает в русло.
  let sprite=null, halfPx;
  if(ty=="rock"){
    sprite=["boulder","fang","slab"][Math.floor(Math.random()*3)];
    halfPx=spriteSize(sprite).w/2*0.82;
  } else {
    halfPx=obHalfPx(ty,sz);
  }
  // Правило проходимости: препятствие шире 45% русла создало бы безвыходный
  // расклад — такой спавн просто отменяется.
  if(halfPx*2>rw*0.45)return;
  const lim=Math.max(0,0.92-2*halfPx/rw);
  g.obs.push({t:(Math.random()*2-1)*lim,wy,type:ty,size:sz,halfPx,sprite,vt:0,
              variant:ty=="kayaker"?Math.floor(Math.random()*3):undefined});
}
function spBn(){
  const wy=spawnWy();
  if(rapidBlend(wy)>0.5)return;            // на порогах бонусов нет
  const t=["bread","whisky","medkit","axe"],w=bonusWeights();
  let r=Math.random(),c=0,ty="bread";
  for(let i=0;i<t.length;i++){c+=w[i];if(r<c){ty=t[i];break;}}
  g.bns.push({t:(Math.random()*2-1)*0.75,wy,type:ty});
}
function spBev(){
  const ty=["bear","camp","ducks","tower","fisher","bush","tree","tree"][Math.floor(Math.random()*8)];
  g.bev.push({type:ty,side:Math.random()<0.5?-1:1,wy:spawnWy(),
              off:ty=="ducks"?10:26+Math.random()*38});
  g.ned=g.dist+22+Math.random()*38;
}
function spPt(x,y,cl,c){
  for(let i=0;i<c;i++){g.pts.push({x,y,vx:(Math.random()-0.5)*7,vy:(Math.random()-0.5)*7,lf:30+Math.random()*20,ml:50,cl,sz:2+Math.random()*3});}
}
function drwPt(){
  for(const p of g.pts){cx.globalAlpha=p.lf/p.ml;cx.fillStyle=p.cl;cx.fillRect(p.x-p.sz/2,p.y-p.sz/2,p.sz,p.sz);}
  cx.globalAlpha=1;
}
function chkCl(){
  const kr=16;
  for(let i=g.obs.length-1;i>=0;i--){
    const o=g.obs[i];
    const hw=widthAt(o.wy)/2;
    const dx=(g.t-o.t)*hw,dy=g.scroll-o.wy;
    if(Math.hypot(dx,dy)<kr+(o.halfPx||16)){
      const ox=screenXOf(o.t,o.wy),oy=screenYOf(o.wy);
      if(o.type=="rock"||o.type=="log"||o.type=="kayaker"){
        if(g.whiskyT>0){                       // под виски всё разлетается в щепки
          spPt(ox,oy,"#e8a838",20);g.obs.splice(i,1);g.sc+=10;
        }else{
          damage();g.obs.splice(i,1);spPt(ox,oy,"#8d6e63",16);
          if(g.s!="playing")return;
        }
      }else if(o.type=="shallows"){g.sp=Math.max(1.5,g.sp*0.65);spPt(ox,oy,"#ffd54f",6);g.obs.splice(i,1);
      }else if(o.type=="seaweed"){g.sp=Math.max(0.8,g.sp*0.45);spPt(ox,oy,"#2e7d32",6);g.obs.splice(i,1);}
    }
  }
  for(let i=g.bns.length-1;i>=0;i--){
    const b=g.bns[i],hw=widthAt(b.wy)/2;
    const dx=(g.t-b.t)*hw,dy=g.scroll-b.wy;
    if(Math.hypot(dx,dy)<kr+14){apBn(b);g.bns.splice(i,1);}
  }
}
/* ===== 6. Прочность и бонусы ===== */
const INV_FRAMES = 90, BREAD_FRAMES = 480, WHISKY_FRAMES = 360, AXE_RANGE = 360;

// Шанс аптечки удваивается при низкой прочности. Игрок этого не замечает,
// но получает ощущение «на грани вытянул».
function bonusWeights(){
  const base = [0.40, 0.15, 0.25, 0.20];     // батон, виски, аптечка, топор
  if (g.hp >= 3) return base;
  const b = base.slice(); b[2] *= 2;
  const sum = b.reduce((x,y)=>x+y,0);
  return b.map(v => v/sum);
}

function damage(){
  if (g.inv > 0 || g.whiskyT > 0) return;
  if (g.sh){ g.sh = false; g.shake = 8; popText("ЩИТ РАЗБИТ","#4fc3f7"); return; }
  g.hp -= 1;
  g.inv = INV_FRAMES;
  g.shake = 10;
  g.sp = Math.max(1.5, g.sp*0.6);
  if (rapidBlend(g.scroll) > 0.5) g.cleanRun = false;
  popText("-1","#ff5252");
  if (g.hp <= 0) gmO();
}

function popText(text, color){
  g.pops.push({ text, color, x: screenXOf(g.t,g.scroll), y: PY - 34, life: 55 });
}

function tickEffects(){
  if (g.breadT  > 0) g.breadT--;
  if (g.whiskyT > 0) g.whiskyT--;
  if (g.inv     > 0) g.inv--;
  for (let i = g.pops.length-1; i >= 0; i--){
    const p = g.pops[i]; p.y -= 0.8;
    if (--p.life <= 0) g.pops.splice(i,1);
  }
}

function apBn(b){
  spPt(screenXOf(b.t,b.wy),screenYOf(b.wy),"#ffd54f",15);
  switch(b.type){
    case "bread":                       // сила гребка
      g.breadT = BREAD_FRAMES; g.bsc += 20; popText("+20 СИЛА","#eec27a"); break;
    case "whisky":                      // кураж: неуязвимость и двойные очки
      g.whiskyT = WHISKY_FRAMES; g.bsc += 50; popText("+50 КУРАЖ","#e8a838"); break;
    case "medkit":                      // прочность, при полной — щит
      if (g.hp < 3){ g.hp += 1; popText("+1 ПРОЧНОСТЬ","#e53935"); }
      else { g.sh = true; popText("ЩИТ","#4fc3f7"); }
      g.bsc += 15; break;
    case "axe": {                       // расчистка пути
      let n = null, nd = Infinity;
      for (const o of g.obs){
        const d = o.wy - g.scroll;
        if (d > 0 && d <= AXE_RANGE && d < nd){ nd = d; n = o; }
      }
      if (n){
        spPt(screenXOf(n.t,n.wy), screenYOf(n.wy), "#a87848", 22);
        g.obs = g.obs.filter(o => o !== n);
        g.shake = 6;
      }
      g.bsc += 25; popText("+25 РУБИМ","#c2ced6"); break;
    }
  }
}
function sg(){
  document.getElementById("startScreen").classList.add("hidden");
  document.getElementById("gameOverScreen").classList.add("hidden");
  g.s="playing";g.sp=2.5;g.dist=0;g.sc=0;g.bsc=0;g.obs=[];g.bns=[];g.pts=[];g.bev=[];
  g.sh=false;g.sm=false;g.st=0;g.ned=30;g.df=1;g.frame=0;
  g.t=0;g.vt=0;g.scroll=0;g.segs=[];g.hp=3;g.inv=0;g.shake=0;g.breadT=0;g.whiskyT=0;g.pops=[];g.wake=[];
  g.cleanRun=false;g.wasRapid=false;
  ensureSegments(H*2);
}
function gmO(){
  const total = Math.floor(g.dist) + g.bsc;
  const isBest = total > loadBest();
  saveBest(total);
  g.s="over";document.getElementById("gameOverScreen").classList.remove("hidden");
  document.getElementById("finalDist").textContent=Math.floor(g.dist);
  document.getElementById("finalBonus").textContent=g.bsc;
  document.getElementById("finalScore").textContent=total;
  document.getElementById("bestScore").textContent=loadBest();
  document.getElementById("newBest").classList.toggle("hidden", !isBest);
}
function upd(){
  if(g.s!="playing")return;g.frame++;
  if(g.sm){g.st--;if(g.st<=0)g.sm=false;}
  g.df=1+g.dist/1000;const tgt=Math.min(6.5,2.5+g.dist/700);g.sp+=(tgt-g.sp)*0.004;
  const sm=g.sm?0.35:1;g.dist+=g.sp*0.04*sm;
  g.scroll += g.sp * sm * speedMulAt(g.scroll) * flowMul(g.t);
  ensureSegments(g.scroll + H*2);
  while (g.segs.length > 40) g.segs.shift();
  g.pa=Math.sin(g.frame*0.12);
  tickEffects();
  g.shake *= 0.88; if (g.shake < 0.1) g.shake = 0;
  // Чистый проход порога: вошёл — взводим флаг, вышел без удара — награда.
  const inRapid = rapidBlend(g.scroll) > 0.5;
  if (inRapid && !g.wasRapid) g.cleanRun = true;
  if (!inRapid && g.wasRapid && g.cleanRun){ g.bsc += 150; popText("ЧИСТЫЙ ПРОХОД +150","#ffd54f"); }
  g.wasRapid = inRapid;
  // Кильватерный след за кормой.
  g.wake.push({ t: g.t, wy: g.scroll });
  if (g.wake.length > 40) g.wake.shift();
  // Брызги от гребка.
  if (g.frame % (g.breadT > 0 ? 9 : 14) === 0)
    spPt(screenXOf(g.t,g.scroll) + (Math.sin(g.frame*0.3)>0?26:-26), PY + 6, "#dff0fa", 3);
  let input = 0;
  if (keys["ArrowLeft"] || keys["a"] || keys["A"]) input = -1;
  if (keys["ArrowRight"] || keys["d"] || keys["D"]) input = 1;
  if (mt !== null){
    const px = screenXOf(g.t, g.scroll);
    if (Math.abs(mt - px) > 4) input = Math.sign(mt - px);
  }
  stepLateral(input);
  const sr=0.018+g.df*0.007;if(Math.random()<sr)spOb();
  if(Math.random()<0.003)spBn();
  if(g.dist>=g.ned)spBev();
  for(let i=g.obs.length-1;i>=0;i--){
    const o=g.obs[i];
    if(o.type=="kayaker"){
      // Соперник тоже сплавляется, но медленнее течения — мы его догоняем.
      o.wy+=g.sp*sm*0.4;
      const hw=widthAt(o.wy)/2;
      let danger=0;
      for(const o2 of g.obs){
        if(o2===o||o2.type=="kayaker")continue;
        const dy=o2.wy-o.wy;
        if(dy>0&&dy<90){const dx=(o.t-o2.t)*hw;if(Math.abs(dx)<44)danger+=dx>=0?1:-1;}
      }
      o.vt+=danger*0.0012+Math.sin(o.wy*0.004)*0.0004;
      o.vt*=0.9;
      o.vt=Math.max(-0.02,Math.min(0.02,o.vt));
      o.t+=o.vt;
      if(o.t>0.85){o.t=0.85;o.vt=0;}
      if(o.t<-0.85){o.t=-0.85;o.vt=0;}
    }
    if(offScreen(o.wy))g.obs.splice(i,1);
  }
  for(let i=g.bns.length-1;i>=0;i--)if(offScreen(g.bns[i].wy))g.bns.splice(i,1);
  for(let i=g.bev.length-1;i>=0;i--)if(offScreen(g.bev[i].wy))g.bev.splice(i,1);
  for(let i=g.pts.length-1;i>=0;i--){const p=g.pts[i];p.x+=p.vx;p.y+=p.vy;p.vy+=0.15;p.lf--;if(p.lf<=0)g.pts.splice(i,1);}
  chkCl();
}
function drwWake(){
  for (let i = 0; i < g.wake.length; i++){
    const p = g.wake[i], a = (i/g.wake.length)*0.30;
    const y = screenYOf(p.wy);
    if (y < -10 || y > H + 10) continue;
    cx.fillStyle = "rgba(255,255,255," + a + ")";
    cx.fillRect(screenXOf(p.t, p.wy) - 12, y, 24, 2);
  }
}
function rndr(){
  cx.clearRect(0,0,W,H);
  cx.save();
  const amp = g.shake + rapidBlend(g.scroll)*2;
  if (amp > 0.1) cx.translate((Math.random()-0.5)*amp, (Math.random()-0.5)*amp);
  drwBg();
  for(const e of g.bev)drwBev(e);
  for(const o of g.obs)drwOb(o);
  for(const b of g.bns)drwBn(b);
  drwWake();drwPt();drwKy();
  cx.restore();
  drwPops();drwHUD();
  if (g.whiskyT > 0){
    cx.strokeStyle = "rgba(232,168,56," + (0.30 + Math.sin(g.frame*0.15)*0.08) + ")";
    cx.lineWidth = 10; cx.strokeRect(5, 5, W-10, H-10);
  }
}
function lp(){upd();rndr();requestAnimationFrame(lp);}

/* ===== 13. Экспорт для тестов ===== */
globalThis.__KAYAK__ = { G: g, PY, centerAt, baseWidthAt, widthAt, curvAt, secondDiff,
  screenYOf, worldYOf, spawnWy, offScreen, screenXOf, ensureSegments, segAt,
  rapidBlend, speedMulAt, stepLateral, flowMul, leanOf, ACC, VMAX, DAMP, DRIFT, TMAX,
  SPR, PAL, SCALE, spriteSize, swapPalette, damage, apBn, bonusWeights, tickEffects,
  loadBest, saveBest, upd, spOb, spBn };
prerenderAll();
if (typeof __KAYAK_TEST__ === "undefined") lp();
</script>
