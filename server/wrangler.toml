name = "kayak-board"
main = "leaderboard-worker.mjs"
compatibility_date = "2026-09-01"

# Хранилище таблиц рекордов (KV). id — пространство kayak-board в аккаунте Cloudflare.
[[kv_namespaces]]
binding = "BOARD"
id = "629f3e793e6246abb66b3e61bacaed30"

# Комнаты гонки вдвоём — Durable Object (класс RaceRoom из race.mjs).
# На бесплатном тарифе — только с хранилищем SQLite (new_sqlite_classes).
[[durable_objects.bindings]]
name = "ROOM"
class_name = "RaceRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RaceRoom"]
